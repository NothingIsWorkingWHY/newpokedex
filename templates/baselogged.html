<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/jpeg" href="/static/images/pokeball.jpg">
</head>
<body class="bg-[url('/static/images/pokemonbackground.jpg')] bg-repeat bg-center">
    <header class="bg-[#DC143C] text-white p-4">
        <div class="container mx-auto flex justify-center items-center">
            <h1 class="text-2xl font-bold">{% block header %}{% endblock %}</h1>
        </div>
    </header>
    <nav class="bg-[#900D09] text-white p-2">
        <div class="container mx-auto flex justify-center space-x-4">
            <a href="{{ url_for('index') }}" class="hover:underline">Pokedex</a>
            <a href="{{ url_for('team') }}" class="hover:underline">Team</a>
            <form action="{{ url_for('logout')}}" method="post">
                <button type="submit" class="hover:underline">Logout</button>
            </form>
        </div>
    </nav>
    <section class="container mx-auto p-4 flex justify-center items-center">
        {% block content %}{% endblock %}
    </section>
</body>
</html>
