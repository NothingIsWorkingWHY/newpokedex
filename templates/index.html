{% extends "base.html" %}

{% block title %}Pokedex{% endblock %}

{% block header %}POKEDEX{% endblock %}

{% block content %}
    <div class="w-full max-w-3xl bg-white border border-black p-4 rounded">
        <label for="pokemon-search" class="sr-only">Search Pokémon by name or ID</label>
        <input
            id="pokemon-search"
            type="search"
            placeholder="Search Pokémon by name or number..."
            autocomplete="off"
            class="mb-3 w-full rounded border border-black p-2"
        >
        <p id="pokemon-status" class="mb-3" aria-live="polite">Loading Pokemon...</p>
        <p id="pokemon-no-results" class="mb-3" hidden>No Pokémon found.</p>
        <ul id="pokemon-list" class="grid grid-cols-2 gap-2 sm:grid-cols-4"></ul>
    </div>
    <script>
        async function fetchPokemon() {
            const status = document.getElementById('pokemon-status');
            const pokemonList = document.getElementById('pokemon-list');
            const searchInput = document.getElementById('pokemon-search');
            const noResults = document.getElementById('pokemon-no-results');

            try {
                const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1000');
                if (!response.ok) {
                    throw new Error('Pokemon could not be loaded.');
                }

                const data = await response.json();
                const pokemon = data.results.map((entry) => ({
                    id: entry.url.split('/').filter(Boolean).pop(),
                    name: entry.name,
                }));

                function renderPokemon() {
                    const query = searchInput.value.trim().toLowerCase();
                    const matches = pokemon.filter((entry) =>
                        entry.name.includes(query) || entry.id.includes(query)
                    );

                    pokemonList.replaceChildren();
                    noResults.hidden = matches.length > 0;
                    matches.forEach((entry) => {
                        const item = document.createElement('li');
                        const link = document.createElement('a');
                        link.href = `/pokemon/${entry.id}`;
                        link.textContent = `${entry.id}: ${entry.name}`;
                        link.className = 'block w-full h-full';
                        item.append(link);
                        item.className = 'rounded border border-black p-2 capitalize';
                        pokemonList.append(item);
                    });
                }

                searchInput.addEventListener('input', renderPokemon);
                renderPokemon();
                status.textContent = '';
            } catch (error) {
                status.textContent = error.message;
            }
        }

        fetchPokemon();
    </script>
{% endblock %}
