{% extends "baselogged.html" %}

{% block title %}Pokémon Details{% endblock %}
{% block header %}Pokémon Details{% endblock %}

{% block content %}
    <div class="w-full max-w-xl rounded border border-black bg-white p-4">
        <p id="pokemon-status" aria-live="polite">Loading Pokémon...</p>

        <div id="pokemon-details" hidden>
        <h2 id="pokemon-name" class="mb-3 text-2xl font-bold capitalize"></h2>
        <div class="mb-3 flex items-center gap-3">
            <img id="pokemon-image" alt="image of the pokemon lol">
            <p id="pokemon-type" class="capitalize"></p>
        </div>
        <h3 class="mb-2 text-xl font-semibold">Stats</h3>
        <ul id="pokemon-stats" class="space-y-1"></ul>
        </div>
    </div>

    <script>
        const pokemonId = {{ pokemon_id | tojson }};
        const status = document.getElementById('pokemon-status');

        async function loadPokemon() {
            const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`);
        if (!response.ok) throw new Error('Could not load this Pokémon.');

        const pokemon = await response.json();
        document.getElementById('pokemon-type').textContent =
        pokemon.types.map(({ type }) => type.name).join(', ');
        document.getElementById('pokemon-name').textContent = pokemon.name;

        const image = document.getElementById('pokemon-image');
        image.src = pokemon.sprites.front_default || '';
        image.alt = `${pokemon.name} image`;
        image.hidden = !image.src;

        const stats = document.getElementById('pokemon-stats');
        pokemon.stats.forEach(({ stat, base_stat }) => {
            const row = document.createElement('li');
            row.textContent = `${stat.name}: ${base_stat}`;
            row.className = 'capitalize';
            stats.appendChild(row);
        });

        status.hidden = true;
        document.getElementById('pokemon-details').hidden = false;
        }

        loadPokemon().catch(error => {
        status.textContent = error.message;
        });
    </script>
{% endblock %}
