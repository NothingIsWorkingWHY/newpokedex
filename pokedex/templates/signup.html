<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-red-900">
    <header class="bg-[#DC143C] text-white p-4">
        <div class="container mx-auto flex justify-center items-center">
            <h1 class="text-2xl font-bold">SIGN UP</h1>
        </div>
    </header>
    <nav class="bg-[#900D09] text-white p-2">
        <div class="container mx-auto flex justify-center space-x-4">
            <a href="{{ url_for('index') }}" class="hover:underline">Pokedex</a>
            <a href="{{ url_for('login') }}" class="hover:underline">Login</a>
            <a href="{{ url_for('signup') }}" class="hover:underline">Sign Up</a>
        </div>
    </nav>
    <section class="container mx-auto p-4 flex justify-center items-center">
        <form action="{{ url_for('login') }}" method="post">
            <label for="fname" class="block text-white mb-2">First Name:</label>
            <input type="text" id="fname" name="fname" required class="border border-black">
            <label for="lname" class="block text-white mb-2">Last Name:</label>
            <input type="text" id="lname" name="lname" required class="border border-black">
            <label for="email" class="block text-white mb-2">Email:</label>
            <input type="email" id="email" name="email" required class="border border-black">
            <label for="username" class="block text-white mb-2">Username:</label>
            <input type="text" id="username" name="username" required class="border border-black">
            <label for="password" class="block text-white mb-2">Password:</label>
            <input type="password" id="password" name="password" required class="border border-black">
            <label for="confirm_password" class="block text-white mb-2">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required class="border border-black">
            <br>
            <button type="submit" class="bg-[#DC143C] text-white px-4 py-2 mt-4 rounded hover:bg-[#900D09]">Sign Up</button>
        </form>
    </section>
</body>
</html>
