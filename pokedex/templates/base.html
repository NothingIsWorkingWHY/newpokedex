<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-red-900">
    <header class="bg-[#DC143C] text-white p-4">
        <div class="container mx-auto flex justify-center items-center">
            <h1 class="text-2xl font-bold">{% block header %}{% endblock %}</h1>
        </div>
    </header>
    <nav class="bg-[#900D09] text-white p-2">
        <div class="container mx-auto flex justify-center space-x-4">
            <a href="{{ url_for('index') }}" class="hover:underline">Pokedex</a>
            <a href="{{ url_for('login') }}" class="hover:underline">Login</a>
            <a href="{{ url_for('signup') }}" class="hover:underline">Sign Up</a>
        </div>
    </nav>
    <section class="container mx-auto p-4 flex justify-center items-center">
        {% block content %}{% endblock %}
    </section>>
</body>
</html>
