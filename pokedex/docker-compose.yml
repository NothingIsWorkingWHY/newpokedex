version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    container_name: user_login
    environment:
      - MYSQL_ROOT_PASSWORD=pokemon
      - MYSQL_DATABASE=login
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - SECRET_KEY=SomeRandomBS67
    ports:
      - "3307:3306"
    volumes:
      - db:/var/lib/mysql
    depends_on: 
      db: 
        condition: service_healthy

  db: 
    image: mariadb:11.4 
    container_name: flask-db 
    restart: unless-stopped 
    environment: 
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: prototype 
      MARIADB_USER: flaskuser 
      MARIADB_PASSWORD: flaskpass 
    volumes: 
      - db_data:/var/lib/mysql 
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql 
    healthcheck: 
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"] 
      interval: 5s 
      timeout: 5s 
      retries: 10 

  adminer: 
    image: adminer 
    container_name: flask-adminer 
    ports: 
      - "8081:8080" 
    depends_on: 
      - db 
 
volumes: 
  db:
  db_data: 
